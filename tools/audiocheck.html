<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>audio check</title>
</head>
<body>
<pre id="out"></pre>
<script type="module">
import { AudioEngine } from '../src/audio/audio.js';
import { SONGS } from '../src/audio/songs/index.js';
import { SFX } from '../src/audio/sfx.js';

const params = new URLSearchParams(location.search);
const kit = params.get('kit') || 'remastered';
const which = params.get('song');
const sfxMode = params.get('sfx') === '1';
const SR = 44100;

function wav(buf) {
  const ch = buf.numberOfChannels;
  const len = buf.length;
  const data = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); data.setUint32(4, 36 + len * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, ch, true);
  data.setUint32(24, SR, true); data.setUint32(28, SR * ch * 2, true); data.setUint16(32, ch * 2, true);
  data.setUint16(34, 16, true); w(36, 'data'); data.setUint32(40, len * ch * 2, true);
  const chans = [...Array(ch).keys()].map((c) => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { data.setInt16(o, Math.max(-1, Math.min(1, chans[c][i])) * 32767, true); o += 2; }
  return new Uint8Array(data.buffer);
}

function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function stats(buf) {
  let peak = 0, sum = 0, clip = 0, nan = 0, silent = 0;
  const n = buf.length;
  const block = SR / 10;
  let blk = 0, blkMax = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) {
      const v = d[i];
      if (Number.isNaN(v)) { nan++; continue; }
      const a = Math.abs(v);
      if (a > peak) peak = a;
      if (a > 0.99) clip++;
      sum += v * v;
      if (c === 0) { blkMax = Math.max(blkMax, a); if (++blk >= block) { if (blkMax < 0.002) silent++; blk = 0; blkMax = 0; } }
    }
  }
  const rms = Math.sqrt(sum / (n * buf.numberOfChannels));
  return { peak: +peak.toFixed(3), rmsDb: +(20 * Math.log10(rms + 1e-9)).toFixed(1), clipPct: +((clip / (n * 2)) * 100).toFixed(3), nan, silentBlocks: silent, sec: +(n / SR).toFixed(1) };
}

async function renderSong(name) {
  const probe = new AudioEngine();
  const def = SONGS[name];
  // compile to know the length
  const ctx0 = new OfflineAudioContext(2, SR, SR);
  probe.init(ctx0);
  const song = probe.getSong(name);
  const secs = (song.length * 60) / def.bpm / 48 + 2.5;
  const ctx = new OfflineAudioContext(2, Math.ceil(secs * SR), SR);
  const eng = new AudioEngine();
  eng.kit = kit;
  eng.init(ctx);
  eng.renderSong(name, 1);
  const buf = await ctx.startRendering();
  return buf;
}

async function renderSfx() {
  const names = Object.keys(SFX);
  const ctx = new OfflineAudioContext(2, SR * (names.length * 1.2 + 4), SR);
  const eng = new AudioEngine();
  eng.kit = kit;
  eng.init(ctx);
  names.forEach((n, i) => eng.sfxAt(n, 0.1 + i * 1.2, 5));
  return { buf: await ctx.startRendering(), names };
}

(async () => {
  const out = {};
  try {
    if (sfxMode) {
      const { buf, names } = await renderSfx();
      out.sfx = stats(buf);
      out.names = names;
      window.__wav = b64(wav(buf));
    } else {
      const names = which ? [which] : Object.keys(SONGS);
      for (const n of names) {
        const buf = await renderSong(n);
        out[n] = stats(buf);
        if (which) window.__wav = b64(wav(buf));
      }
    }
  } catch (e) {
    out.error = String(e.stack || e);
  }
  document.getElementById('out').textContent = JSON.stringify(out, null, 1);
  window.__stats = out;
  document.title = 'done';
})();
</script>
</body>
</html>

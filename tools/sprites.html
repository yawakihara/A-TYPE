<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>VOID LANCE sprite sheet</title>
<style>
  body { margin: 0; background: #101426; color: #cfd8ff; font: 12px monospace; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1440" height="1000"></canvas>
<script type="module">
import { buildSprites, SPR, ITEM_STYLE } from '../js/sprites.js';
import { buildBossSprites, BOSS } from '../js/bosses.js';
import { drawText } from '../js/font.js';

buildSprites();
buildBossSprites();
const c = document.getElementById('c');
const g = c.getContext('2d');
g.imageSmoothingEnabled = false;
g.fillStyle = '#2a3050';
g.fillRect(0, 0, c.width, c.height);
const Z = 4;
let x = 8;
let y = 8;
let rowH = 0;

function put(img, label, zoom = Z) {
  const w = img.width * zoom;
  const h = img.height * zoom;
  if (x + w + 8 > c.width) { x = 8; y += rowH + 16; rowH = 0; }
  g.drawImage(img, x, y + 10, w, h);
  g.fillStyle = '#cfd8ff';
  g.font = '10px monospace';
  g.fillText(label, x, y + 8);
  x += w + 10;
  rowH = Math.max(rowH, h + 10);
}

put(SPR.ship.mid, 'ship', 5);
put(SPR.ship.up, 'ship up', 5);
put(SPR.ship.dn, 'ship dn', 5);
SPR.pod.forEach((fr, i) => put(fr[0], `pod${i}`, 5));
put(SPR.bit[0], 'bit', 5);
SPR.drone.slice(0, 3).forEach((f, i) => put(f, `drone${i}`, 5));
SPR.swooper.forEach((f, i) => put(f, `swooper${i}`, 5));
put(SPR.rusher, 'rusher', 5);
put(SPR.walker, 'walker', 5);
put(SPR.turretBase, 'turret', 5);
SPR.mine.forEach((f, i) => put(f, `mine${i}`, 5));
put(SPR.serpentHead, 'serpHead', 5);
put(SPR.serpentSeg[0], 'seg', 5);
SPR.orbiter.slice(0, 2).forEach((f, i) => put(f, `orb${i}`, 5));
SPR.cargo.forEach((f, i) => put(f, `cargo${i}`, 5));
put(SPR.gunship, 'gunship', 4);
for (const t of Object.keys(ITEM_STYLE)) put(SPR.item[t][0], t, 5);
SPR.pellet.forEach((f, i) => put(f, `pel${i}`, 5));
put(SPR.orbShot[0], 'orbShot', 5);
put(SPR.spore[0], 'spore', 5);
put(SPR.eMissile[0], 'emis', 5);
SPR.expSmall.forEach((f, i) => put(f, `eS${i}`, 3));
SPR.expBig.forEach((f, i) => put(f, `eB${i}`, 2));
put(BOSS.warden.body, 'warden', 2);
put(BOSS.warden.barrel, 'barrel', 4);
put(BOSS.hive.body, 'hive', 2);
BOSS.hive.seg.slice(0, 4).forEach((f, i) => put(f, `seg${i}`, 4));
put(BOSS.dread.body, 'dread', 2);
document.title = 'ready';
</script>
</body>
</html>

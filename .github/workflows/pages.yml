name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 単体テスト
        run: npm test
      - name: 単一HTMLにビルド
        run: npm run build
      - name: E2E用のChromiumを準備
        run: npx playwright install --with-deps chromium
      - name: E2E(ボットが全ステージと通しプレイを完走)
        run: |
          node tools/serve.mjs 8123 &
          sleep 1
          npm run e2e
      - name: 公開ファイルをまとめる
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          cp -r docs/screenshots _site/screenshots
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

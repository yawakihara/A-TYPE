<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<meta name="description" content="AEGIS LANCE - 溜め撃ちビームと着脱式ポッドで戦う横スクロールシューティング。HD/アーケード表示とサウンドをリアルタイムで切り替えられます。">
<!--BUILD:HEAD-START-->
<title>AEGIS LANCE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2304050a'/%3E%3Cpath d='M8 36h30l10-4-10-4H8z' fill='%23e8ecf6'/%3E%3Cpath d='M14 28l6-8h6l-4 8z' fill='%23ff5a7a'/%3E%3Ccircle cx='50' cy='32' r='8' fill='%233ff0ff'/%3E%3Ccircle cx='50' cy='32' r='4' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="src/style.css">
<!--BUILD:HEAD-END-->
</head>
<body>
<!--BUILD:BODY-START-->
<div id="stage" class="stage">
  <canvas id="screen" class="screen" tabindex="0" aria-label="AEGIS LANCE game screen"></canvas>
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-mark">AEGIS LANCE</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div id="boot-msg" class="boot-msg">INITIALIZING…</div>
  </div>
  <div id="touch" class="touch" hidden>
    <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
    <div class="touch-btns">
      <button id="btn-pod" class="tbtn tbtn-pod" type="button" aria-label="POD">POD</button>
      <button id="btn-rapid" class="tbtn tbtn-rapid" type="button" aria-label="RAPID">RAPID</button>
      <button id="btn-fire" class="tbtn tbtn-fire" type="button" aria-label="FIRE / CHARGE">FIRE</button>
    </div>
    <button id="btn-pause" class="tbtn tbtn-pause" type="button" aria-label="PAUSE">II</button>
  </div>
  <pre id="err" class="err" hidden></pre>
</div>
<noscript>JavaScript を有効にしてください / Please enable JavaScript.</noscript>
<!--BUILD:BODY-END-->
<!--BUILD:SCRIPT-->
<script type="module" src="src/main.js"></script>
<!--BUILD:SCRIPT-END-->
</body>
</html>
